session_name: hercules
suppress_history: false

environment:
  BAG_DIR: '~/data/hercules_datasets/V1.2/ausenv_test1_checkpoints_CSLAM_2UAVUGV_pruned'
  BAG_PLAY_RATE: '0.5'
  ROS_WS: '~/slideslam_original_ws'

options:
  default-command: /bin/bash

windows:
- window_name: Main
  layout: tiled
  focus: true
  shell_command_before:
  - export ROS_MASTER_URI=http://localhost:11311
  - source ${ROS_WS}/devel/setup.bash
  panes:
  - shell_command:
    - sleep 2
    - roslaunch scan2shape_launch infer_node.launch
  - shell_command: 
    - sleep 2
    - roslaunch object_modeller sync_semantic_measurements.launch robot_name:=robot0 odom_topic:=/Odometry
  - shell_command: 
    - sleep 2
    - roslaunch sloam single_robot_sloam_test_LiDAR.launch enable_rviz:=true
  - shell_command:
    - sleep 2
    - roslaunch scan2shape_launch process_cloud_node_outdoor_with_ns.launch
  - shell_command:
    - sleep 2
    - roslaunch scan2shape_launch run_flio_with_driver.launch
  - shell_command:
    - sleep 10
    - cd $BAG_DIR && rosbag play outdoor-falcon4*.bag --clock -r $BAG_PLAY_RATE -s 0 --topics /os_node/lidar_packets /os_node/imu_packets /os_node/metadata

- window_name: roscore
  layout: tiled
  shell_command_before:
  - export ROS_MASTER_URI=http://localhost:11311
  - source ${ROS_WS}/devel/setup.bash
  panes:
  - roscore
  - shell_command:
    - sleep 1
    - rosparam set /use_sim_time true
  -
  -

- window_name: exit
  layout: tiled
  shell_command_before:
  - export ROS_MASTER_URI=http://localhost:11311
  - source ${ROS_WS}/devel/setup.bash
  panes:
  - echo "tmux kill-session -t hercules"