session_name: slide_slam_nodes
environment:
  BAG_PLAY_RATE: "1.0"
  DATASET_NUM: "V2.3.C"
  DATA_DIR: '/home/dbutterfield3/data/Hercules_datasets/V2.3.C'
  RESULT_DIR: '/home/dbutterfield3/data/Hercules_datasets/V2.3.C/results/slideslam/'
  ROBOT_NAME_0: 'Husky1'
  ROBOT_0_T: "[0.0,0.055,0.35]"
  ROBOT_0_R: "[0.5,-0.5,0.5,-0.5]"      
  ROBOT_NAME_1: 'Drone2'
  ROBOT_1_T: "[0.35,0.055,-0.2]"
  ROBOT_1_R: "[0.45451948,-0.45451948,0.54167522,-0.54167522]"
start_directory: "~/slideslam_original_ws"
windows:
  - window_name: ROBOT_0
    layout: tiled
    shell_command_before:
      - export ROS_MASTER_URI=http://localhost:11311
      - source ~/slideslam_original_ws/devel/setup.bash
      - sleep 2
    panes:
      - shell_command:
          - roslaunch object_modeller rgb_segmentation_f250_hercules.launch odom_topic:=/${ROBOT_NAME_0}/odom robot_name:=${ROBOT_NAME_0} label_color_map_path:=${DATA_DIR}/data/label_color_map.csv dataset_num:=${DATASET_NUM}
      - shell_command:
          - roslaunch scan2shape_launch process_cloud_node_hercules.launch odom_topic:=/${ROBOT_NAME_0}/odom robot_name:=${ROBOT_NAME_0} camera_frame_wrt_odom_frame_T:=${ROBOT_0_T} camera_frame_wrt_odom_frame_R_quat:=${ROBOT_0_R} dataset_num:=${DATASET_NUM}
      - shell_command:
          - roslaunch object_modeller sync_semantic_measurements.launch robot_name:=${ROBOT_NAME_0} odom_topic:=/${ROBOT_NAME_0}/odom cls_config_path:=/home/dbutterfield3/slideslam_original_ws/src/SLIDE_SLAM/frontend/object_modeller/config/Hercules/${DATASET_NUM}/hercules_cls_config.yaml
      - shell_command:
          - roslaunch sloam sloam_hercules.launch enable_rviz:=true odom_topic:=/${ROBOT_NAME_0}/odom robot_name:=${ROBOT_NAME_0} hostRobot_ID:=0 save_results_dir:=${RESULT_DIR}/${ROBOT_NAME_0}_${ROBOT_NAME_1}/${ROBOT_NAME_0} dataset_num:=${DATASET_NUM}

  - window_name: ROBOT_1
    layout: tiled
    shell_command_before:
      - export ROS_MASTER_URI=http://localhost:11311
      - source ~/slideslam_original_ws/devel/setup.bash
      - sleep 2
    panes:
      - shell_command:
          - roslaunch object_modeller rgb_segmentation_f250_hercules.launch odom_topic:=/${ROBOT_NAME_1}/odom robot_name:=${ROBOT_NAME_1} label_color_map_path:=${DATA_DIR}/data/label_color_map.csv dataset_num:=${DATASET_NUM}
      - shell_command:
          - roslaunch scan2shape_launch process_cloud_node_hercules.launch odom_topic:=/${ROBOT_NAME_1}/odom robot_name:=${ROBOT_NAME_1} camera_frame_wrt_odom_frame_T:=${ROBOT_1_T} camera_frame_wrt_odom_frame_R_quat:=${ROBOT_1_R} dataset_num:=${DATASET_NUM}
      - shell_command:
          - roslaunch object_modeller sync_semantic_measurements.launch robot_name:=${ROBOT_NAME_1} odom_topic:=/${ROBOT_NAME_1}/odom cls_config_path:=/home/dbutterfield3/slideslam_original_ws/src/SLIDE_SLAM/frontend/object_modeller/config/Hercules/${DATASET_NUM}/hercules_cls_config.yaml
      - shell_command:
          - roslaunch sloam sloam_hercules.launch enable_rviz:=false odom_topic:=/${ROBOT_NAME_1}/odom robot_name:=${ROBOT_NAME_1} hostRobot_ID:=1 save_results_dir:=${RESULT_DIR}/${ROBOT_NAME_0}_${ROBOT_NAME_1}/${ROBOT_NAME_1} dataset_num:=${DATASET_NUM}

  - window_name: roscore
    layout: tiled
    shell_command_before:
      - export ROS_MASTER_URI=http://localhost:11311
      - source ~/slideslam_original_ws/devel/setup.bash
    panes:
      - shell_command:
          - roscore
      - shell_command:
          - sleep 1
      - shell_command:
          - sleep 2
          - python src/SLIDE_SLAM/dependencies/robotdataprocess/examples/Hercules/publish/publish_data_SlideSLAM.py --dataset_num ${DATASET_NUM} --robot_name ${ROBOT_NAME_0}
      - shell_command:
          - sleep 2
          - python src/SLIDE_SLAM/dependencies/robotdataprocess/examples/Hercules/publish/publish_data_SlideSLAM.py --dataset_num ${DATASET_NUM} --robot_name ${ROBOT_NAME_1}
  
  - window_name: kill
    panes:
      - shell_command:
          - tmux kill-session -t slide_slam_nodes_

