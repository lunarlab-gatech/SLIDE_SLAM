session_name: slide_slam_nodes
environment:
  BAG_PLAY_RATE: "1.0"
  BAG_DIR: '/home/dbutterfield3/slideslam_original_ws/src/SLIDE_SLAM/data/raw_data/indoor'
start_directory: "~/slideslam_original_ws"
windows:
  - window_name: Main
    layout: tiled
    shell_command_before:
      - export ROS_MASTER_URI=http://localhost:11311
      - sleep 2
    panes:
      - shell_command:
          - roslaunch object_modeller rgb_segmentation_f250.launch
      - shell_command:
          - roslaunch object_modeller sync_semantic_measurements.launch robot_name:=robot0 odom_topic:=/dragonfly67/quadrotor_ukf/control_odom
      - shell_command:
          - roslaunch sloam single_robot_sloam_test.launch enable_rviz:=true
      - shell_command:
          - roslaunch scan2shape_launch process_cloud_node_rgbd_indoor_with_ns.launch odom_topic:=/dragonfly67/quadrotor_ukf/control_odom robot_name:=robot0

  - window_name: roscore
    layout: tiled
    shell_command_before:
      - export ROS_MASTER_URI=http://localhost:11311
    panes:
      - shell_command:
          - roscore
      - shell_command:
          - sleep 1
          - rosparam set /use_sim_time true
      - shell_command:
          - sleep 2
          - cd ${BAG_DIR}
          - rosbag play indoor-f250-*.bag --clock -r ${BAG_PLAY_RATE} -s 0 --topics /dragonfly67/quadrotor_ukf/control_odom /camera/aligned_depth_to_color/image_raw /camera/color/image_raw /camera/depth/image_rect_raw /camera/aligned_depth_to_color/image_raw:=/robot0/camera/aligned_depth_to_color/image_raw /camera/color/image_raw:=/robot0/camera/color/image_raw /camera/depth/image_rect_raw:=/robot0/camera/depth/image_rect_raw
      - shell_command:
          - 
  
  - window_name: kill
    panes:
      - shell_command:
          - tmux kill-session -t slide_slam_nodes___